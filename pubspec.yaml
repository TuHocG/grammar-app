name: grammar
description: "Grammar 4.0 - English learning app, successor of Grammar 3.1 (https://tuhocg.github.io/)."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  audioplayers: ^6.8.1
  crypto: ^3.0.6
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  # Only the Android implementation: the umbrella package also builds permission_handler_windows,
  # which fails on VS 2026 (Baseflow/flutter-permission-handler#1534), and the app needs no
  # permissions elsewhere.
  permission_handler_android: ^14.1.0
  permission_handler_platform_interface: ^4.4.1
  # Pinned: web/sqlite3.wasm is the build of this exact version (README "Bản web").
  sqlite3: 3.7.1
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/g_tile.png
  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
    # Glyphs the two families lack, as the fallback of every text style so they look the same
    # everywhere, offline included (Flutter would otherwise fetch Noto from Google at run time):
    # IPA letters (ʃ ʒ ɪ ɔ ː …) and extended Latin from Noto Sans, arrows and marks (→ ✓ ≈) from
    # Noto Sans Symbols; both OFL, cut down to those ranges (README "Bản web").
    - family: Noto Sans IPA
      fonts:
        - asset: assets/fonts/NotoSansIPA-Regular.ttf
    - family: Noto Sans Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
