# Release build: push a tag vX.Y.Z (matching `version:` in pubspec.yaml) to build Windows, Android
# and macOS and attach them to a draft GitHub Release. Run manually (Actions → Release →
# Run workflow) to build without publishing, optionally one platform only or without the check job.
# Secrets: see README "Phát hành".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Build only this platform (data = the lesson data bundle only)
        type: choice
        options: [all, windows, android, macos, data]
        default: all
      skip_check:
        description: Skip the check job (content check, flutter analyze / test)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  # Always runs: names the packages, refuses a tag that differs from pubspec.yaml and picks the
  # desktop targets for the `platform` input.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      desktop: ${{ steps.targets.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version, check it matches the tag
        run: |
          v=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $v"; exit 1
          fi
      - id: targets
        name: Desktop build matrix
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          all='[
            {"os": "windows", "arch": "x64",   "runner": "windows-latest"},
            {"os": "macos",   "arch": "universal", "runner": "macos-latest"}
          ]'
          echo "desktop=$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .os == $p))' <<< "$all")" >> "$GITHUB_OUTPUT"

  check:
    if: ${{ !inputs.skip_check }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tool/content/check.py && python3 tool/content/pack.py
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Lesson data for users: grammar.db (+ embedded picture pages) and img/, encrypted with the same key
  # the apps are built with (tool/encrypt_db.dart, hence Flutter); attached to the draft release.
  data:
    needs: check
    # Runs when check passed or was skipped (skip_check), not when it failed.
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'data') }}
    runs-on: ubuntu-22.04
    # Secrets live in the `Release` environment (Settings → Environments); every job reading them names it.
    environment: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - env:
          GRAMMAR_DB_KEY: ${{ secrets.GRAMMAR_DB_KEY }}
        run: python3 tool/content/bundle.py
      - uses: actions/upload-artifact@v4
        with: { name: pkg-data, path: 'build/content/grammar4-data-*.zip' }

  desktop:
    needs: [version, check]
    # Runs when check passed or was skipped (skip_check), not when it failed.
    if: ${{ !cancelled() && !failure() && needs.version.outputs.desktop != '[]' }}
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    environment: Release
    env:
      GRAMMAR_DB_KEY: ${{ secrets.GRAMMAR_DB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-build
        with:
          targets: ${{ matrix.os }}
          symbols: symbols-${{ matrix.os }}-${{ matrix.arch }}
      - name: Package
        shell: bash
        run: |
          out=Grammar-${{ needs.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          case ${{ matrix.os }} in
            windows)
              # Ship the MSVC runtime next to grammar.exe so it runs without the VC++ Redistributable.
              bundle=build/windows/x64/runner/Release
              cp /c/Windows/System32/{msvcp140,vcruntime140,vcruntime140_1}.dll "$bundle"
              (cd "$bundle" && 7z a -tzip "$GITHUB_WORKSPACE/$out.zip" .) ;;
            macos)
              # Ad-hoc signed, not notarized: first launch needs right-click → Open (README "Phát hành").
              ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Grammar 4.0.app" "$out.zip" ;;
          esac
      - uses: actions/upload-artifact@v4
        with: { name: 'pkg-${{ matrix.os }}-${{ matrix.arch }}', path: 'Grammar-*' }

  android:
    needs: [version, check]
    # Runs when check passed or was skipped (skip_check), not when it failed.
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    environment: Release
    env:
      GRAMMAR_DB_KEY: ${{ secrets.GRAMMAR_DB_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing; refusing to ship a debug-signed APK"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: ./.github/actions/flutter-build
        with:
          targets: apk appbundle
          symbols: symbols-android
      - name: Package
        run: |
          v=${{ needs.version.outputs.version }}
          cp build/app/outputs/flutter-apk/app-release.apk "Grammar-$v-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "Grammar-$v-android.aab"
      - uses: actions/upload-artifact@v4
        with: { name: pkg-android, path: 'Grammar-*' }

  release:
    if: github.ref_type == 'tag'
    needs: [version, check, data, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: 'pkg-*', merge-multiple: true }
      # Draft: edit the notes (docs/08 "cố ý khác" list, data/audio links) before publishing.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
