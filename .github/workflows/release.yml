# Release build: push a tag vX.Y.Z (matching `version:` in pubspec.yaml) to build Windows, Android,
# macOS and the web, attach the installers and the data to a draft GitHub Release, and put the web
# site on the preview URL (production follows when the release is published: deploy-web.yml). Run
# manually (Actions → Release → Run workflow) to build without a release, optionally one platform
# only or without the check job. Secrets: see README "Phát hành".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Build only this platform (data = the lesson data bundle only)
        type: choice
        options: [all, windows, android, macos, data, web]
        default: all
      skip_check:
        description: Skip the check job (content check, flutter analyze / test)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  # Always runs: names the packages, refuses a tag that differs from pubspec.yaml and picks the
  # desktop targets for the `platform` input.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      desktop: ${{ steps.targets.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version, check it matches the tag
        run: |
          v=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $v"; exit 1
          fi
      - id: targets
        name: Desktop build matrix
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          all='[
            {"os": "windows", "arch": "x64",   "runner": "windows-latest"},
            {"os": "macos",   "arch": "universal", "runner": "macos-latest"}
          ]'
          echo "desktop=$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .os == $p))' <<< "$all")" >> "$GITHUB_OUTPUT"

  check:
    if: ${{ !inputs.skip_check }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tool/content/check.py && python3 tool/content/pack.py
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Compile gate for the web build (docs/07 §12): catches dart:ffi / package:sqlite3/sqlite3.dart in
      # shared code. dart:io compiles for the web and only fails at run time; test/platform_imports_test.dart
      # keeps it inside the *_io.dart files.
      - run: python3 tool/web/build_web.py

  # Lesson data for users: grammar.db (+ embedded picture pages) and grammar.images, two files to download
  # by hand, plus grammar.db.gz and bundle.json, which the apps download by themselves (lib/platform/downloader_io.dart).
  data:
    needs: check
    # Runs when check passed or was skipped (skip_check), not when it failed.
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'data' || inputs.platform == 'web') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The packages depend only on the dataset and the tools that pack it: when neither changed since
      # a run that built them (a code-only branch, a rebuild of the web app), reuse that run's output.
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            build/content
            build/host
          key: data-${{ runner.os }}-${{ hashFiles('content/dataset/**', 'content/content.json', 'tool/content/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tool/content/bundle.py --host
      # Packages are uploaded unzipped (archive: false), one file per artifact named after the file,
      # so each downloads on its own without a zip around it. build/host (the web data) is one artifact.
      - uses: actions/upload-artifact@v7
        with: { name: host, path: build/host }
      - uses: actions/upload-artifact@v7
        with: { path: build/content/grammar.db, archive: false }
      - uses: actions/upload-artifact@v7
        with: { path: build/content/grammar.db.gz, archive: false }
      - uses: actions/upload-artifact@v7
        with: { path: build/content/grammar.images, archive: false }
      - uses: actions/upload-artifact@v7
        with: { path: build/content/bundle.json, archive: false }

  desktop:
    needs: [version, check]
    # Runs when check passed or was skipped (skip_check), not when it failed.
    if: ${{ !cancelled() && !failure() && needs.version.outputs.desktop != '[]' }}
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-build
        with:
          targets: ${{ matrix.os }}
          symbols: symbols-${{ matrix.os }}-${{ matrix.arch }}
      - name: Package
        id: package
        shell: bash
        # No version in the file name: https://github.com/<repo>/releases/latest/download/<file> then
        # always points at the newest release (the app and the home page link there).
        run: |
          out=Grammar-${{ matrix.os }}-${{ matrix.arch }}
          case ${{ matrix.os }} in
            windows)
              # Ship the MSVC runtime next to grammar.exe so it runs without the VC++ Redistributable.
              bundle=build/windows/x64/runner/Release
              cp /c/Windows/System32/{msvcp140,vcruntime140,vcruntime140_1}.dll "$bundle"
              (cd "$bundle" && 7z a -tzip "$GITHUB_WORKSPACE/$out.zip" .) ;;
            macos)
              # Ad-hoc signed, not notarized: first launch needs right-click → Open (README "Phát hành").
              ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Grammar 4.0.app" "$out.zip" ;;
          esac
          echo "file=$(ls Grammar-*)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with: { path: '${{ steps.package.outputs.file }}', archive: false }

  android:
    needs: [version, check]
    # Runs when check passed or was skipped (skip_check), not when it failed.
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    # Secrets live in the `Release` environment (Settings → Environments); every job reading them names it.
    environment: Release
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        # Gradle's downloads (wrapper, plugins, dependencies), keyed by the build files.
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing; refusing to ship a debug-signed APK"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: ./.github/actions/flutter-build
        with:
          targets: apk appbundle
          symbols: symbols-android
      - name: Package
        # No version in the file name, see the desktop job.
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Grammar-android.apk
          cp build/app/outputs/bundle/release/app-release.aab Grammar-android.aab
      - uses: actions/upload-artifact@v7
        with: { path: 'Grammar-*.apk', archive: false }
      - uses: actions/upload-artifact@v7
        with: { path: 'Grammar-*.aab', archive: false }

  # The web app (docs/07 §12): built once, kept as the `site` artifact, shown on the preview URL
  # (marked noindex). deploy-web.yml puts the same artifact on production when the release is published.
  web:
    needs: [version, check, data]
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'web') }}
    runs-on: ubuntu-22.04
    environment: Release
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: python3 tool/web/build_web.py --dart-define=GIT_COMMIT="$(git rev-parse --short HEAD)" --dart-define=GIT_COMMIT_MESSAGE="$(git log -1 --format=%s)"
      - uses: actions/download-artifact@v8
        with: { name: host, path: build/host }
      - run: python3 tool/web/build_site.py --live https://grammar4.pages.dev
      - uses: actions/upload-artifact@v7
        with: { name: site, path: build/site, retention-days: 90 }
      - name: Deploy the preview
        # Skipped until the Cloudflare secrets exist (README "Phát hành"); the site artifact is made anyway.
        # A tag goes to the `preview` alias the draft release links to; a manual run gets an alias
        # named after its branch (prefixed: `main` is the production branch of the Pages project),
        # so it never overwrites what the owner is testing for a release, nor production.
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy build/site-preview --project-name grammar4 --branch "${{ github.ref_type == 'tag' && 'preview' || format('manual-{0}', github.ref_name) }}" --commit-dirty=true

  release:
    if: github.ref_type == 'tag'
    needs: [version, check, data, desktop, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # skip-decompress: v8 extracts any artifact served as a zip, including the Windows/macOS packages
      # uploaded with archive: false; every artifact here is a single file, so keep them as they are.
      # symbols-* stay out of the release.
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: 'Grammar-*', merge-multiple: true, skip-decompress: true }
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: 'grammar.*', merge-multiple: true, skip-decompress: true }
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: 'bundle.json', merge-multiple: true, skip-decompress: true }
      # Draft: edit the notes (docs/08 "cố ý khác" list, data/audio links) before publishing. Only a
      # published release is `releases/latest`, where the home page and (docs/07 §12) the app will look.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            Bản web để thử trước khi publish: https://preview.grammar4.pages.dev (nếu đã có secret Cloudflare; publish release này thì bản web lên https://grammar4.pages.dev).
          files: dist/*
