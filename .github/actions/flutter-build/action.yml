# Release build used by every platform job of .github/workflows/release.yml: set up Flutter, run
# `flutter build` with the release flags (docs/07 §11) and keep the split debug info as a private
# artifact. The job provides FLUTTER_VERSION and GRAMMAR_DB_KEY in its environment.
name: Flutter release build
description: flutter build <targets> --release --obfuscate with the content DB key; uploads build/symbols.

inputs:
  targets:
    description: flutter build targets, space separated (e.g. "windows" or "apk appbundle")
    required: true
  symbols:
    description: name of the artifact holding the debug symbols
    required: true

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
    - shell: bash
      run: |
        for t in ${{ inputs.targets }}; do
          flutter build "$t" --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=GRAMMAR_DB_KEY="$GRAMMAR_DB_KEY"
        done
    - uses: actions/upload-artifact@v7
      with: { name: '${{ inputs.symbols }}', path: build/symbols, retention-days: 90 }
